services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: sahayak, POSTGRES_PASSWORD: sahayak, POSTGRES_DB: sahayak}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U sahayak"], interval: 5s, retries: 10}
  app:
    build: .
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgresql://sahayak:sahayak@db:5432/sahayak
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      OTP_DEV_ECHO: "1"        # local demo only; remove, set SAHAYAK_ENV=prod and the secrets in .env.example for real use
volumes: {pgdata: {}}
